plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		java.srcDir rootProject.file('common-1.21/src/main/java')
		resources.srcDir rootProject.file('common-1.21/src/main/resources')
	}
}

neoForge {
	version = project.neoforge_version

	runs {
		client {
			client()
		}
	}

	mods {
		"block_capture" {
			sourceSet sourceSets.main
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def baseName = project.archives_base_name
	inputs.property "baseName", baseName

	from("LICENSE") {
		rename { "${it}_$baseName" }
	}
}
