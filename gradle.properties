# Done to increase the memory available to gradle.
# -Djdk.tls.client.protocols=TLSv1.2 works around a TLS handshake failure
# against maven.neoforged.net on some machines/networks.
org.gradle.jvmargs=-Xmx2G -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

